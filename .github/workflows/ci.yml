name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # strict-mode typecheck (tsconfig has strict: true)
      - name: Typecheck
        run: npx tsc --noEmit

      # ESLint: errors fail the build; the ~189 pre-existing no-explicit-any
      # findings are configured as warnings in .eslintrc.json and stay visible.
      - name: Lint
        run: npx next lint

      - name: Build
        run: npm run build

      # Playwright smoke suite: hermetic (all API calls mocked at the
      # browser level) against the production build just produced, so it
      # also exercises the strict CSP. No credentials/secrets required.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report (failures only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
