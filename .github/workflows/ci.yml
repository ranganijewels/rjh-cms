name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # strict-mode typecheck (tsconfig has strict: true)
      - name: Typecheck
        run: npx tsc --noEmit

      # ESLint: errors fail the build; the ~189 pre-existing no-explicit-any
      # findings are configured as warnings in .eslintrc.json and stay visible.
      - name: Lint
        run: npx next lint

      - name: Build
        run: npm run build
